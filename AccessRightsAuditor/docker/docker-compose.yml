# PostgreSQL для разработки и тестирования ARA (не для промышленной эксплуатации).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ara
      POSTGRES_USER: ara
      POSTGRES_PASSWORD: ${PGPASSWORD:-ara_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ara-pg:/var/lib/postgresql/data
volumes:
  ara-pg:
