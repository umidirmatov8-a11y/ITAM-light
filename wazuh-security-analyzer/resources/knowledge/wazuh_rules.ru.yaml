# Русский перевод пояснений базы знаний правил (описания правил остаются как в Wazuh).
rules:
  "1002":
    explanation: "Общее сообщение об ошибке совпало с шаблоном syslog «error». Само по себе редко связано с безопасностью."
    false_positives:
      - "Ошибки приложений, неправильно настроенные службы, подробное журналирование"
    investigation:
      - "Прочитайте полную запись журнала, чтобы определить программу, сообщившую об ошибке"
      - "Проверьте, повторяется ли ошибка и совпадает ли с другими алертами на хосте"
    remediation:
      - "Устраните проблему службы или настройте правило для «шумных» программ"
  "502":
    explanation: "Запущена служба менеджера Wazuh. Ожидаемо после обслуживания или перезагрузки."
    false_positives:
      - "Плановые перезапуски, обновления"
    investigation:
      - "Убедитесь, что перезапуск был плановым"
  "503":
    explanation: "Агент Wazuh запущен и подключился. Нормально после перезагрузок и обновлений агента."
    false_positives:
      - "Перезагрузки, обновления агента"
    investigation:
      - "Сверьтесь с журналом изменений, если запуск неожиданный"
  "506":
    explanation: "Агент Wazuh остановлен. Обычно это обслуживание, но атакующие останавливают агенты защиты, чтобы избежать обнаружения."
    false_positives:
      - "Перезагрузки, окна обслуживания, обновления агента"
    investigation:
      - "Выясните, кто остановил агент и перезагружался ли хост"
      - "Убедитесь, что агент снова в сети"
      - "Ищите подозрительную активность непосредственно перед остановкой агента"
    remediation:
      - "Перезапустите агент и защитите его службу от несанкционированных изменений"
  "510":
    explanation: "Rootcheck обнаружил аномалию, например скрытый файл, процесс или сигнатуру известного руткита."
    false_positives:
      - "Легитимные файлы в необычных местах, модули ядра стороннего ПО"
    investigation:
      - "Изучите вывод rootcheck, чтобы найти конкретный файл или процесс"
      - "Сравните хеш файла с эталонным ПО"
      - "Проверьте хост на неожиданные процессы и модули ядра"
    remediation:
      - "Изолируйте хост, если руткит подтверждён"
      - "Переустановите систему с доверенного носителя, если скомпрометировано ядро"
  "521":
    explanation: "Rootcheck обнаружил поведение, указывающее на возможный руткит уровня ядра, например процессы или порты, скрытые от системных утилит."
    false_positives:
      - "Состояние гонки на сильно нагруженных системах, некоторые драйверы средств защиты или виртуализации"
    investigation:
      - "Повторите rootcheck и сравните результаты"
      - "Изучите загруженные модули ядра"
      - "Проверьте скрытые порты внешним сканированием"
    remediation:
      - "Изолируйте хост"
      - "Проведите офлайн-криминалистику"
      - "Переустановите систему с доверенного носителя"
  "550":
    explanation: "Контроль целостности файлов обнаружил изменение содержимого контролируемого файла."
    false_positives:
      - "Обновления ПО, системы управления конфигурацией (Ansible, Puppet, GPO), правки администраторов"
    investigation:
      - "Определите изменённый файл и сравните старый и новый хеши"
      - "Проверьте, выполнялись ли в это время обновления или развёртывание"
      - "Выясните, кто был в системе в момент изменения"
    remediation:
      - "Восстановите файл из доверенного источника, если изменение несанкционированное"
  "553":
    explanation: "Удалён контролируемый файл."
    false_positives:
      - "Ротация журналов, обновление пакетов, сценарии очистки"
    investigation:
      - "Определите удалённый файл и его важность"
      - "Ищите связанную активность процессов или пользователей"
    remediation:
      - "Восстановите файл из резервной копии, если удаление несанкционированное"
  "554":
    explanation: "В контролируемом каталоге появился новый файл."
    false_positives:
      - "Установка ПО, обновления, новые файлы конфигурации"
    investigation:
      - "Проверьте путь, владельца и хеш файла"
      - "Проверьте хеш в threat intelligence, если расположение необычное"
    remediation:
      - "Удалите файл, если он появился без разрешения"
  "2502":
    explanation: "Один и тот же пользователь несколько раз подряд ввёл неверный пароль."
    false_positives:
      - "Пользователи, забывшие или недавно сменившие пароль, сценарии с устаревшим паролем"
    investigation:
      - "Проверьте, последовал ли успешный вход"
      - "Уточните у пользователя, его ли это действия"
    remediation:
      - "Смените пароль, если пользователь не совершал эти попытки"
  "5104":
    explanation: "Сетевой интерфейс переведён в неразборчивый режим, позволяющий перехватывать трафик, не адресованный хосту."
    false_positives:
      - "Диагностика сети с tcpdump/Wireshark, мосты виртуализации, сенсоры IDS"
    investigation:
      - "Определите процесс и пользователя, включивших неразборчивый режим"
      - "Проверьте, установлены или запущены ли средства перехвата трафика"
    remediation:
      - "Остановите несанкционированные средства перехвата и проверьте учётные данные, передававшиеся в этом сегменте"
  "5401":
    explanation: "Пользователь трижды не смог пройти аутентификацию в sudo."
    false_positives:
      - "Опечатки в пароле"
    investigation:
      - "Проверьте, выполнил ли тот же пользователь позже sudo успешно"
      - "Уточните у пользователя, его ли это действия"
    remediation:
      - "Заблокируйте учётную запись, если пользователь отрицает эти действия"
  "5402":
    explanation: "Пользователь выполнил команду от имени root через sudo."
    false_positives:
      - "Обычное администрирование"
    investigation:
      - "Изучите выполненную команду"
      - "Убедитесь, что пользователь — уполномоченный администратор"
    remediation:
      - "Ограничьте права sudo минимально необходимыми"
  "5403":
    explanation: "Пользователь впервые выполнил sudo на этом хосте."
    false_positives:
      - "Новые администраторы, новые учётные записи автоматизации"
    investigation:
      - "Убедитесь, что пользователю положены административные права"
    remediation:
      - "Удалите пользователя из sudoers, если права не согласованы"
  "5501":
    explanation: "На хосте открыт сеанс входа."
    false_positives:
      - "Обычная активность пользователей и служб"
    investigation:
      - "Проверьте источник сеанса, если ему предшествовали неудачные входы"
  "5502":
    explanation: "Сеанс входа закрыт."
    false_positives:
      - "Обычная активность"
  "5503":
    explanation: "PAM сообщил о неудачном входе пользователя."
    false_positives:
      - "Опечатки в пароле"
    investigation:
      - "Проверьте количество неудачных попыток и исходный хост"
    remediation:
      - "Включите политику блокировки учётных записей"
  "5551":
    explanation: "Wazuh скоррелировал несколько неудачных входов PAM за короткое время, что типично для подбора пароля."
    false_positives:
      - "Неправильно настроенные службы, повторяющие попытки с неверным паролем"
    investigation:
      - "Определите источник и атакованные учётные записи"
      - "Проверьте, был ли успешный вход с того же источника"
    remediation:
      - "Заблокируйте источник, если он вредоносный"
      - "Включите блокировку учётных записей и многофакторную аутентификацию"
  "5701":
    explanation: "SSH-сервер получил некорректное или зондирующее подключение, типичное для сканеров и сбора версий."
    false_positives:
      - "Системы мониторинга, сканеры уязвимостей"
    investigation:
      - "Проверьте, не является ли источник известным сканером"
      - "Ищите последующие попытки аутентификации с того же IP"
    remediation:
      - "Ограничьте доступ к SSH межсетевым экраном или VPN"
  "5710":
    explanation: "Кто-то пытался войти по SSH под учётной записью, которой нет на хосте. Атакующие так подбирают распространённые имена (admin, root, test, oracle)."
    false_positives:
      - "Опечатки в имени пользователя, автоматизация с неверной учётной записью, внутренние сканеры уязвимостей"
    investigation:
      - "Подсчитайте попытки и разные имена пользователей с этого IP"
      - "Проверьте, был ли успешный вход с того же IP"
      - "Проверьте, атаковались ли с этого IP другие хосты"
    remediation:
      - "Заблокируйте IP-адрес источника на межсетевом экране, если он вредоносный"
      - "Отключите вход по паролю для SSH и используйте ключи"
      - "Ограничьте доступ к SSH сетями VPN или управления"
  "5712":
    explanation: "Wazuh скоррелировал множество попыток входа по SSH с несуществующими именами с одного источника — типичный подбор пароля / перебор имён."
    false_positives:
      - "Внутренние сканеры уязвимостей, неправильно настроенная автоматизация"
    investigation:
      - "Определите все атакованные имена пользователей и хосты"
      - "Проверьте, был ли успешный вход с того же IP"
      - "Проверьте репутацию IP"
    remediation:
      - "Заблокируйте IP-адрес источника"
      - "Отключите вход по паролю для SSH"
      - "Используйте fail2ban или active response Wazuh"
  "5715":
    explanation: "Пользователь успешно вошёл по SSH."
    false_positives:
      - "Обычное администрирование"
    investigation:
      - "Убедитесь, что вход ожидаем, если ему предшествовали неудачные попытки или он выполнен с внешнего IP"
      - "Изучите команды, выполненные после входа"
    remediation:
      - "Смените учётные данные и завершите сеансы, если вход несанкционированный"
  "5716":
    explanation: "Попытка входа по SSH под существующей учётной записью не удалась (неверный пароль или ключ)."
    false_positives:
      - "Опечатки в пароле, просроченные ключи"
    investigation:
      - "Подсчитайте неудачные попытки по источникам и пользователям"
      - "Проверьте последующие успешные входы"
    remediation:
      - "Используйте аутентификацию по ключам и многофакторную аутентификацию"
  "5720":
    explanation: "Wazuh скоррелировал несколько неудачных входов по SSH для существующих пользователей с одного источника — возможный подбор пароля."
    false_positives:
      - "Пользователи со сменённым паролем и сохранёнными сеансами, неправильно настроенная автоматизация"
    investigation:
      - "Определите источник, атакованные учётные записи и был ли успешный вход"
    remediation:
      - "Заблокируйте источник, включите аутентификацию по ключам и блокировку учётных записей"
  "5758":
    explanation: "SSH-сервер закрыл соединение после слишком большого числа попыток аутентификации в одном сеансе."
    false_positives:
      - "SSH-клиенты, предлагающие много ключей"
    investigation:
      - "Проверьте IP-адрес источника и другие неудачные попытки с него"
    remediation:
      - "Ограничьте доступ к SSH и используйте fail2ban / active response"
  "5760":
    explanation: "Попытка аутентификации по SSH не удалась."
    false_positives:
      - "Опечатки в пароле"
    investigation:
      - "Проверьте повторяющиеся неудачи и последующие успешные входы с того же источника"
  "5763":
    explanation: "Wazuh скоррелировал повторяющиеся неудачные входы по SSH с одного источника — признак подбора пароля."
    false_positives:
      - "Автоматизация с устаревшими учётными данными"
    investigation:
      - "Проверьте успешные входы с того же IP"
      - "Определите атакованные учётные записи"
    remediation:
      - "Заблокируйте IP-адрес источника"
      - "Смените пароли атакованных учётных записей"
  "5901":
    explanation: "Создана новая локальная группа."
    false_positives:
      - "Установка пакетов, развёртывание"
    investigation:
      - "Выясните, кто и зачем создал группу"
    remediation:
      - "Удалите группу, если она создана без разрешения"
  "5902":
    explanation: "Создана новая локальная учётная запись. Атакующие создают учётные записи, чтобы сохранить доступ."
    false_positives:
      - "Развёртывание, установка пакетов со служебными пользователями"
    investigation:
      - "Выясните, кто создал учётную запись и из какого сеанса"
      - "Проверьте группы и оболочку учётной записи"
      - "Сверьтесь с журналом изменений"
    remediation:
      - "Отключите/удалите учётную запись, если она создана без разрешения, и расследуйте создавший её сеанс"
  "5904":
    explanation: "Изменены атрибуты локальной учётной записи (оболочка, домашний каталог, группы)."
    false_positives:
      - "Обслуживание администратором"
    investigation:
      - "Изучите, что изменилось и кто внёс изменение"
    remediation:
      - "Отмените несанкционированные изменения"
  "31101":
    explanation: "Веб-сервер вернул ошибку 4xx. Большое количество таких ошибок с одного источника обычно означает сканирование."
    false_positives:
      - "Битые ссылки, поисковые роботы, мониторинг"
    investigation:
      - "Изучите URL, запрошенные с IP-адреса источника"
    remediation:
      - "Ограничьте частоту запросов или заблокируйте злоупотребляющие источники"
  "31103":
    explanation: "Веб-запрос содержит шаблоны, типичные для SQL-инъекции."
    false_positives:
      - "Сканеры безопасности, легитимные запросы с ключевыми словами SQL"
    investigation:
      - "Проверьте код ответа HTTP — 200 может означать успех"
      - "Изучите журналы приложения и базы данных за то же время"
      - "Ищите другие атаки с того же IP"
    remediation:
      - "Используйте параметризованные запросы"
      - "Разверните или настройте WAF"
      - "Заблокируйте IP-адрес источника"
  "31104":
    explanation: "Веб-запрос совпал с шаблонами распространённых атак (обход каталогов, внедрение команд и т. п.)."
    false_positives:
      - "Сканеры уязвимостей"
    investigation:
      - "Проверьте, вернул ли запрос код 200, и изучите целевое приложение"
    remediation:
      - "Обновите приложение, примените правила WAF"
  "31105":
    explanation: "Веб-запрос содержит шаблоны внедрения сценариев (XSS)."
    false_positives:
      - "Сканеры, приложения, принимающие HTML"
    investigation:
      - "Проверьте, отражается или сохраняется ли вредоносная нагрузка приложением"
    remediation:
      - "Экранируйте вывод и проверяйте ввод; примените WAF"
  "31106":
    explanation: "На запрос с признаками атаки сервер ответил HTTP 200 — атака могла быть обработана приложением."
    false_positives:
      - "Приложения, отвечающие 200 на ошибки, сканеры статических страниц"
    investigation:
      - "Изучите полный запрос и ответ"
      - "Проверьте журналы приложения и запросы к базе данных"
      - "Проверьте веб-сервер на новые файлы (веб-шеллы)"
    remediation:
      - "Исправьте уязвимый компонент"
      - "Заблокируйте источник"
      - "Ищите веб-шеллы"
  "31151":
    explanation: "Один источник вызвал много ошибок HTTP 4xx — типично для перебора каталогов или сканирования уязвимостей."
    false_positives:
      - "Разрешённые сканеры, неисправные клиенты"
    investigation:
      - "Проверьте, разрешён ли сканер"
      - "Ищите успешные запросы (200) после сканирования"
    remediation:
      - "Ограничьте частоту запросов или заблокируйте источник"
  "4101":
    explanation: "Межсетевой экран отбросил соединение."
    false_positives:
      - "Обычный фоновый шум из Интернета"
    investigation:
      - "Имеет значение только в большом количестве или если адресат критичен"
  "4151":
    explanation: "Отброшено много соединений с одного источника — часто это сканирование портов."
    false_positives:
      - "Неправильно настроенные клиенты, фоновый шум из Интернета"
    investigation:
      - "Проверьте целевые порты и хосты"
      - "Проверьте репутацию IP"
    remediation:
      - "Блокируйте настойчивые сканеры на периметре"
  "60106":
    explanation: "Успешный вход в Windows (событие 4624)."
    false_positives:
      - "Обычные входы пользователей и служб"
    investigation:
      - "Проверьте тип входа и источник, если ему предшествовали неудачные входы"
  "60122":
    explanation: "Вход в Windows не удался из-за неизвестного имени пользователя или неверного пароля (событие 4625)."
    false_positives:
      - "Опечатки в пароле, службы с просроченным паролем, подключённые диски со старыми учётными данными"
    investigation:
      - "Проверьте тип входа, рабочую станцию и IP-адрес источника"
      - "Подсчитайте неудачи по учётным записям"
    remediation:
      - "Включите блокировку учётных записей, проверьте служебную учётную запись с ошибками"
  "60204":
    explanation: "Wazuh скоррелировал несколько неудачных входов в Windows — возможен подбор или распыление паролей."
    false_positives:
      - "Служебные учётные записи с просроченными паролями"
    investigation:
      - "Определите атакованные учётные записи и исходную рабочую станцию/IP"
      - "Проверьте успешные входы (4624) с того же источника"
    remediation:
