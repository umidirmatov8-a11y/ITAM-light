# Русская версия плейбуков (структура, условия и плейсхолдеры совпадают с playbooks.yaml).
playbooks:
  brute_force: &auth_attack
    immediate:
      - {text: "Проверьте, был ли успешный вход с {src_ip} (правила Wazuh 5715, 5501, 60106 с этого IP)."}
      - {text: "Завершите активные сеансы {user} и смените пароль — после неудачных попыток последовал успешный вход.", when: [success_after_failures]}
      - {text: "Заблокируйте {src_ip} на периметровом межсетевом экране после подтверждения вредоносной активности (или используйте active response firewall-drop в Wazuh).", when: [external_source], unless: [malicious_ioc]}
      - {text: "Немедленно заблокируйте {src_ip} на межсетевом экране — это подтверждённый вредоносный индикатор.", when: [malicious_ioc]}
    investigation:
      - {text: "Подсчитайте все попытки с {src_ip} по всем агентам в Wazuh (поиск data.srcip:{src_ip})."}
      - {text: "Составьте список всех учётных записей, атакованных с {src_ip}: {users}.", when: [multiple_users]}
      - {text: "Проверьте, существует ли учётная запись '{user}' и является ли она привилегированной."}
      - {text: "Изучите события аутентификации на {agent} за 30 минут до и после {first_seen}."}
      - {text: "Проверьте {agent} на новые процессы, запланированные задачи и исходящие соединения после успешного входа.", when: [success_after_failures]}
      - {text: "Проверьте журналы межсетевого экрана, VPN и EDR на другой трафик с {src_ip}."}
      - {text: "Прежде чем эскалировать, проверьте, не является ли {src_ip} внутренним сканером или неправильно настроенной службой.", when: [internal_source]}
      - {text: "Проверьте репутацию {src_ip} (AbuseIPDB, VirusTotal, OTX).", when: [external_source]}
    remediation:
      - {text: "Смените учётные данные '{user}' и проверьте её недавнюю активность.", when: [success_after_failures]}
      - {text: "Отключите вход по паролю для SSH на {agent} и используйте аутентификацию по ключам.", when: [ssh]}
      - {text: "Ограничьте удалённый доступ к {agent} сетями VPN или управления."}
    prevention:
      - {text: "Включите многофакторную аутентификацию для удалённого доступа и привилегированных учётных записей."}
      - {text: "Включите блокировку учётных записей / ограничение частоты попыток (fail2ban, active response Wazuh)."}
      - {text: "Удалите стандартные и неиспользуемые учётные записи (admin, test, oracle, guest)."}
  auth_failure: *auth_attack
  auth_success:
    immediate:
      - {text: "Уточните у владельца '{user}', был ли вход на {agent} с {src_ip} легитимным.", when: [external_source], unless: [success_after_failures]}
      - {text: "Считайте сеанс '{user}' потенциально скомпрометированным: отключите учётную запись или завершите сеанс до проверки.", when: [success_after_failures]}
    investigation:
      - {text: "Изучите команды, процессы и сетевые соединения на {agent} после {first_seen}."}
      - {text: "Проверьте, входит ли '{user}' обычно с {src_ip} и в это время суток."}
      - {text: "Найдите другие входы '{user}' на других хостах в тот же период."}
    remediation:
      - {text: "Смените пароль '{user}' и отзовите SSH-ключи/токены, если вход не подтверждён.", when: [success_after_failures]}
    prevention:
      - {text: "Требуйте многофакторную аутентификацию и ограничьте входы из внешних сетей."}
  privilege_escalation:
    immediate:
      - {text: "Убедитесь, что '{user}' имеет право выполнять привилегированные команды на {agent}."}
    investigation:
      - {text: "Изучите команды, выполненные с повышенными правами: {command_line}."}
      - {text: "Проверьте, что '{user}' делал на {agent} до и после повышения привилегий."}
    remediation:
      - {text: "Уберите у '{user}' лишние права sudo/администратора."}
    prevention:
      - {text: "Применяйте принцип наименьших привилегий и централизованно журналируйте привилегированные команды."}
  account_change:
    immediate:
      - {text: "Убедитесь, что изменение учётной записи на {agent} было согласовано (заявка на изменение)."}
      - {text: "Отключите новую/изменённую учётную запись '{user}', если изменение не согласовано."}
    investigation:
      - {text: "Определите сеанс и пользователя, выполнившего изменение, и его источник."}
      - {text: "Проверьте членство '{user}' в группах (administrators, sudo, wheel)."}
    remediation:
      - {text: "Удалите несогласованные учётные записи и отмените изменения групп."}
    prevention:
      - {text: "Ограничьте управление учётными записями отдельными административными учётными записями и настройте оповещения об изменении привилегированных групп."}
  execution:
    immediate:
      - {text: "Изолируйте {agent} от сети, если ИТ-служба не знает эту команду.", when: [high_risk]}
      - {text: "Сохраните полную командную строку и родительский процесс, пока доказательства не утрачены."}
    investigation:
      - {text: "Декодируйте и изучите команду: {command_line}."}
      - {text: "Определите родительский процесс ({process}) и пользователя '{user}', который его запустил."}
      - {text: "Проверьте {agent} на файлы, загруженные или созданные около {first_seen}."}
      - {text: "Найдите ту же командную строку на других хостах."}
      - {text: "Проверьте исходящие сетевые соединения {agent} после выполнения."}
    remediation:
      - {text: "Удалите все механизмы закрепления (запланированные задачи, службы, ключи Run), созданные командой."}
      - {text: "Смените учётные данные '{user}', если пользователь не запускал эту команду."}
    prevention:
      - {text: "Включите режим ограниченного языка PowerShell, журналирование блоков сценариев и AMSI."}
      - {text: "Используйте контроль приложений (AppLocker/WDAC), чтобы блокировать неподписанные сценарии."}
  credential_access:
    immediate:
      - {text: "Изолируйте {agent} — дамп учётных данных указывает на ручную работу атакующего."}
      - {text: "Считайте учётные данные, использовавшиеся на {agent}, скомпрометированными; подготовьте смену паролей привилегированных учётных записей."}
    investigation:
      - {text: "Определите процесс, обращающийся к учётным данным: {process}."}
      - {text: "Составьте список учётных записей, недавно входивших на {agent}, — их учётные данные могли быть раскрыты."}
      - {text: "Ищите горизонтальное перемещение с {agent} с использованием раскрытых учётных записей."}
    remediation:
      - {text: "Смените пароли всех учётных записей, раскрытых на {agent} (включая служебные и krbtgt, если был раскрыт администратор домена)."}
    prevention:
      - {text: "Включите защиту LSA / Credential Guard и уберите права локального администратора."}
  persistence:
    immediate:
      - {text: "Проверьте, относится ли механизм закрепления на {agent} к разрешённому ПО."}
    investigation:
      - {text: "Изучите созданную задачу/службу/параметр реестра и исполняемый файл, на который он указывает."}
      - {text: "Проверьте хеш файла {hash} в источниках threat intelligence."}
    remediation:
      - {text: "Удалите несогласованную запись закрепления и связанный исполняемый файл."}
    prevention:
      - {text: "Контролируйте места автозапуска с помощью FIM Wazuh и Sysmon."}
  defense_evasion:
    immediate:
      - {text: "Выясните, почему на {agent} изменены журналирование или средства защиты."}
    investigation:
      - {text: "Проверьте активность на {agent} непосредственно перед этим событием — атакующие очищают журналы после своих действий."}
      - {text: "Сравните локальные журналы с централизованно собранными событиями Wazuh, чтобы найти пропуски."}
    remediation:
      - {text: "Восстановите настройки безопасности и перезапустите затронутые агенты/службы."}
    prevention:
      - {text: "Пересылайте журналы централизованно в реальном времени и защитите средства безопасности от вмешательства."}
  network_c2:
    immediate:
      - {text: "Заблокируйте исходящий трафик с {agent} к {src_ip} на межсетевом экране/прокси, если он не связан с бизнесом.", when: [external_source]}
    investigation:
      - {text: "Определите процесс ({process}), открывший соединение, и его родительский процесс."}
      - {text: "Проверьте журналы прокси и межсетевого экрана на объём и периодичность трафика к этому адресу."}
      - {text: "Проверьте репутацию адреса назначения."}
    remediation:
      - {text: "Удалите ответственный исполняемый файл/сценарий и изолируйте {agent}, если подтверждена связь с управляющим сервером."}
    prevention:
      - {text: "Включите фильтрацию исходящего трафика и аутентификацию на прокси для серверов."}
  lateral_movement:
    immediate:
      - {text: "Проверьте, выполнял ли удалённый доступ к {agent} администратор."}
    investigation:
      - {text: "Отследите исходный хост и учётную запись '{user}' и изучите их активность."}
    remediation:
      - {text: "Смените учётные данные '{user}', если подтверждено злоупотребление."}
    prevention:
      - {text: "Сегментируйте сеть и ограничьте административные протоколы (SMB, WinRM, RDP) jump-хостами."}
  web_attack:
    immediate:
      - {text: "Заблокируйте {src_ip} на WAF/межсетевом экране, если атаки продолжаются.", when: [external_source]}
    investigation:
      - {text: "Проверьте коды ответов HTTP для {src_ip} — ответы 200 могут означать успешную атаку."}
      - {text: "Изучите атакованные URL и журналы приложения на {agent}."}
      - {text: "Проверьте веб-каталог на {agent} на новые или изменённые файлы (веб-шеллы)."}
    remediation:
      - {text: "Исправьте или обновите атакованный компонент приложения."}
    prevention:
      - {text: "Разверните/настройте WAF и проверяйте входные данные на стороне сервера."}
  scan:
    immediate:
      - {text: "Проверьте, является ли {src_ip} разрешённым сканером (внутреннее управление уязвимостями)."}
    investigation:
      - {text: "Определите, какие хосты и порты зондировал {src_ip}."}
      - {text: "Ищите успешные соединения или входы с {src_ip} после сканирования."}
    remediation:
      - {text: "Заблокируйте {src_ip} на периметре, если сканирование не разрешено.", when: [external_source]}
    prevention:
      - {text: "Сократите число открытых служб и ведите список разрешённых сканеров в настройках анализатора."}
  malware:
    immediate:
      - {text: "Изолируйте {agent} от сети до завершения анализа файла.", when: [high_risk]}
      - {text: "Поместите в карантин или удалите {file_path}."}
    investigation:
      - {text: "Проверьте, запускался ли {file_path} (создание процессов / событие Sysmon 1)."}
      - {text: "Найдите хеш {hash} на всех остальных агентах."}
      - {text: "Выясните, как файл попал на хост (загрузка, вложение письма, USB, перемещение по сети)."}
      - {text: "Изучите исходящие соединения {agent} после появления файла."}
    remediation:
      - {text: "Выполните полную проверку {agent} средствами EDR/антивируса и удалите все обнаруженные артефакты."}
      - {text: "Смените учётные данные, использовавшиеся на {agent}, если вредоносное ПО запускалось."}
    prevention:
      - {text: "Поддерживайте защиту конечных точек в актуальном состоянии и ограничьте запуск из папок, доступных пользователю на запись."}
  impact:
    immediate:
      - {text: "Немедленно изолируйте {agent} — деструктивные действия (например, удаление теневых копий) часто предшествуют шифрованию."}
      - {text: "Убедитесь, что есть свежие и защищённые офлайн-копии данных."}
    investigation:
      - {text: "Определите процесс и пользователя '{user}', выполнивших: {command_line}."}
      - {text: "Проверьте другие хосты на ту же команду или на признаки шифрования файлов."}
    remediation:
      - {text: "После устранения угрозы восстановите затронутые системы из проверенных резервных копий."}
    prevention:
      - {text: "Защитите резервные копии (неизменяемые/офлайн) и ограничьте административные инструменты."}
  fim:
    immediate:
      - {text: "Проверьте, объясняется ли изменение {file_path} плановым изменением или обновлением."}
    investigation:
      - {text: "Сравните старое и новое содержимое/хеш {file_path}."}
      - {text: "Определите пользователя/процесс, изменивший файл (включите who-data для этого пути, если её нет)."}
    remediation:
      - {text: "Восстановите {file_path} из доверенного источника, если изменение несанкционированное."}
    prevention:
      - {text: "Включите who-data и мониторинг в реальном времени в FIM Wazuh для критичных путей."}
  vulnerability:
    immediate:
      - {text: "В первую очередь обновите {package} на {agent} — {cve} входит в CISA KEV (активно эксплуатируется).", when: [kev]}
    investigation:
      - {text: "Сверьте установленную версию {package} на {agent} с бюллетенем производителя для {cve}."}
      - {text: "Проверьте, доступна ли уязвимая служба из сети."}
      - {text: "Ищите попытки эксплуатации против {agent}."}
    remediation:
      - {text: "Обновите {package} до исправленной версии, указанной в бюллетене производителя для {cve}."}
      - {text: "Если обновление невозможно сразу, примените меры, рекомендованные производителем."}
    prevention:
      - {text: "Поддерживайте регулярные циклы обновлений и отслеживайте CISA KEV на новые эксплуатируемые уязвимости."}
  policy:
    immediate: []
    investigation:
      - {text: "Изучите проваленную проверку конфигурации на {agent} и её обоснование."}
    remediation:
      - {text: "Примените рекомендуемую настройку защиты или задокументируйте принятое исключение."}
    prevention:
      - {text: "Отслеживайте соответствие SCA во времени и включите настройки защиты в шаблоны сборки."}
  system:
    immediate: []
    investigation:
      - {text: "Убедитесь, что событие агента/службы на {agent} соответствует плановым работам."}
    remediation: []
    prevention: []
  network:
    immediate: []
    investigation:
      - {text: "Изучите параметры соединения и то, должен ли {src_ip} обращаться к {agent}."}
    remediation: []
    prevention:
      - {text: "Пересмотрите правила межсетевого экрана на предмет лишней доступности."}
  process_activity:
    immediate: []
    investigation:
      - {text: "Изучите дерево процессов на {agent}, если процесс ({process}) неожиданный."}
    remediation: []
    prevention: []
  other:
    immediate: []
    investigation:
      - {text: "Прочитайте полную запись журнала по правилу {rule_id} на {agent} и проверьте связанные события в пределах ±30 минут."}
      - {text: "Проверьте, ожидаема ли такая активность для {agent}."}
    remediation: []
    prevention:
      - {text: "Настройте правило или добавьте локальное правило Wazuh, если событие безобидное и «шумное»."}
