name: AgentLoop (Windows)

on:
  push:
    paths:
      - 'agent-loop/**'
      - '.github/workflows/agent-loop.yml'
  pull_request:
    paths:
      - 'agent-loop/**'
  workflow_dispatch:

env:
  MODEL_REPO: Qwen/Qwen2.5-3B-Instruct-GGUF
  MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: agent-loop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: agent-loop/models
          key: gguf-${{ env.MODEL_FILE }}

      - name: Build exe, download engine + weights, build installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\build.ps1 -Python python -ModelRepo $env:MODEL_REPO -ModelFile $env:MODEL_FILE

      - name: Smoke test exe
        run: |
          $p = Start-Process dist\AgentLoop.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AgentLoop.exe --version exited with $($p.ExitCode)" }
          Get-Content runtime\VERSION.txt

      - name: Silent install (as a user would get it)
        run: |
          $p = Start-Process installer\Output\AgentLoop-Setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$PWD\install.log"
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "installer exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\AgentLoop'
          Get-ChildItem $app -Recurse | Format-Table FullName, Length
          foreach ($f in 'AgentLoop.exe', 'runtime\llama-server.exe', "models\$env:MODEL_FILE") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing after install: $f" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AgentLoop.lnk'
          if (-not (Test-Path $lnk)) { throw "desktop shortcut not created: $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Output "Desktop shortcut -> $target"
          if ($target -ne (Join-Path $app 'AgentLoop.exe')) { throw "shortcut points to $target" }

      - name: Run the three agents on the installed app (no GPU on this runner -> must fall back to the CPU)
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AgentLoop\AgentLoop.exe'
          $report = Join-Path $PWD 'e2e-report.md'
          $task = 'Напиши функцию на Python, которая проверяет, является ли строка палиндромом (без учёта регистра и пробелов), и приведи 3 примера вызова.'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -PassThru -ArgumentList '--provider', 'local', '--iterations', '2', '--report', "`"$report`"", '--task', "`"$task`""
          if (-not $p.WaitForExit(45 * 60 * 1000)) { $p.Kill(); throw "timed out" }
          Write-Output "exit code: $($p.ExitCode) (0 = accepted by verifier, 1 = best of rejected attempts, 2 = error); $([int]$sw.Elapsed.TotalSeconds) s"
          if (Test-Path $report) { Get-Content $report -Encoding utf8 }
          & (Join-Path (Split-Path $exe) 'runtime\llama-server.exe') --list-devices 2>&1 | Out-String | Write-Output
          foreach ($mode in 'gpu', 'cpu') {
            $log = Join-Path $env:TEMP "agentloop-llama-server-$mode.log"
            if (Test-Path $log) { Write-Output "--- $mode log (tail) ---"; Get-Content $log -Tail 20 }
          }
          if ($p.ExitCode -gt 1 -or -not (Test-Path $report)) { throw "agent loop failed" }
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "llama-server still running after AgentLoop exited" }

      - uses: actions/upload-artifact@v4
        with:
          name: AgentLoop-Setup-windows
          path: agent-loop/installer/Output/
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            agent-loop/e2e-report.md
            agent-loop/install.log
          if-no-files-found: ignore

  # The runner has no GPU: give it a software Vulkan device (Mesa lavapipe) to exercise the whole GPU path
  # of the Vulkan build - driver loading, layer offload, answers - on a tiny model.
  vulkan-gpu-path:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: agent-loop
    env:
      VULKAN_VERSION: 1.4.357.0
      TINY_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
      TINY_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vulkan loader
        run: |
          $dll = "$env:WINDIR\System32\vulkan-1.dll"
          if (-not (Test-Path $dll)) {
            curl.exe -sSL -o "$env:RUNNER_TEMP\VulkanRT.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanRT-X64-$env:VULKAN_VERSION-Installer.exe"
            Start-Process "$env:RUNNER_TEMP\VulkanRT.exe" -ArgumentList '/S' -Wait
          }
          Get-Item $dll | Select-Object FullName, Length, @{n='Version'; e={$_.VersionInfo.FileVersion}} | Format-List

      - name: Software GPU (Mesa lavapipe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "no msvc release asset in mesa-dist-win $($rel.tag_name): $($rel.assets.name -join ', ')" }
          Write-Output "Mesa $($rel.tag_name): $($asset.name)"
          curl.exe -sSL -o "$env:RUNNER_TEMP\mesa.7z" $asset.browser_download_url
          7z x "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" -y | Out-Null
          $icd = Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter 'lvp_icd.x86_64.json' | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $icd) { $icd = Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter 'lvp_icd*.json' | Select-Object -First 1 }
          if (-not $icd) { throw "lavapipe ICD manifest not found" }
          Write-Output "ICD: $($icd.FullName)"
          # The runner is elevated, so the Vulkan loader ignores VK_DRIVER_FILES: register the driver in the
          # registry, the way a GPU driver installer does.
          $key = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $icd.FullName -PropertyType DWord -Value 0 -Force | Out-Null
          Add-Content $env:GITHUB_ENV "VK_DRIVER_FILES=$($icd.FullName)"
          # ggml-vulkan skips CPU-type Vulkan devices such as llvmpipe unless they are selected explicitly
          Add-Content $env:GITHUB_ENV "GGML_VK_VISIBLE_DEVICES=0"

      - name: Download the Vulkan llama.cpp build and a tiny model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r requirements.txt
          python scripts/fetch_assets.py --backend vulkan --model-repo $env:TINY_REPO --model-file $env:TINY_FILE
          Get-ChildItem runtime | Format-Table Name, Length

      - name: Run the agents on the (software) GPU
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          Get-ChildItem (Split-Path $env:VK_DRIVER_FILES) | Format-Table Name, Length
          Get-Content $env:VK_DRIVER_FILES
          Write-Output '--- llama-server --list-devices (with Vulkan loader debug) ---'
          $env:VK_LOADER_DEBUG = 'all'
          & runtime\llama-server.exe --list-devices 2>&1 | Out-String | Write-Output
          Remove-Item Env:VK_LOADER_DEBUG
          python main.py --provider local --gpu auto --iterations 1 --report e2e-gpu-report.md `
            --task "Напиши функцию на Python, которая складывает два числа, и один пример вызова." 2>&1 | Tee-Object -FilePath run.txt
          $code = $LASTEXITCODE
          Write-Output "exit code: $code"
          foreach ($mode in 'gpu', 'cpu') {
            $log = Join-Path $env:RUNNER_TEMP "agentloop-llama-server-$mode.log"
            if (Test-Path $log) { Write-Output "--- $mode log (tail) ---"; Get-Content $log -Tail 30 }
          }
          if ($code -gt 1) { throw "agent loop failed" }
          $device = Select-String -Path run.txt -Pattern 'работает на: (.+)$' -Encoding utf8 | Select-Object -Last 1
          Write-Output "device: $($device.Matches[0].Groups[1].Value)"
          if (-not $device -or $device.Matches[0].Groups[1].Value -notmatch '^видеокарта') { throw "the model did not run on the Vulkan device" }
