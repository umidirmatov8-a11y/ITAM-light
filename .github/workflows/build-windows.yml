name: Build Windows EXE

on:
  push:
    branches: [main, "claude/**"]
    paths: ["wazuh-security-analyzer/**", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0); leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: wazuh-security-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wazuh-security-analyzer/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not slow"

      - name: Build WazuhSecurityAnalyzer.exe
        env:
          WSA_ONEFILE: "1"
        run: python -m PyInstaller --noconfirm --clean WazuhSecurityAnalyzer.spec

      - name: Self-test of the executable
        run: |
          $env:WSA_HOME = Join-Path $env:RUNNER_TEMP "wsa_selftest"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\WazuhSecurityAnalyzer.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $env:WSA_HOME "logs\self_test.log") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WazuhSecurityAnalyzer-windows
          path: wazuh-security-analyzer/dist/WazuhSecurityAnalyzer.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Wazuh Security Analyzer ${{ inputs.release_tag || github.ref_name }}
          body: |
            Windows desktop application - download `WazuhSecurityAnalyzer.exe` below and run it (no Python required).
            The executable passed the automated test suite and its built-in self-test on windows-latest.
            Note: the file is not code-signed, so Windows SmartScreen may ask for confirmation ("More info" -> "Run anyway").
          files: wazuh-security-analyzer/dist/WazuhSecurityAnalyzer.exe
