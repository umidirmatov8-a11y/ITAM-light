name: Build Windows EXE

on:
  push:
    branches: [main, "claude/**"]
    paths: ["wazuh-security-analyzer/**", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: wazuh-security-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wazuh-security-analyzer/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not slow"

      - name: Build WazuhSecurityAnalyzer.exe
        env:
          WSA_ONEFILE: "1"
        run: python -m PyInstaller --noconfirm --clean WazuhSecurityAnalyzer.spec

      - name: Self-test of the executable
        run: |
          $env:WSA_HOME = Join-Path $env:RUNNER_TEMP "wsa_selftest"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\WazuhSecurityAnalyzer.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $env:WSA_HOME "logs\self_test.log") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WazuhSecurityAnalyzer-windows
          path: wazuh-security-analyzer/dist/WazuhSecurityAnalyzer.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wazuh-security-analyzer/dist/WazuhSecurityAnalyzer.exe
